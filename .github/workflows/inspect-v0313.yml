name: Inspect DragLab v0.3.13

on:
  push:
    paths:
      - '.github/workflows/inspect-v0313.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inspect verified release source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inspect
          mkdir inspect
          gh release download v0.3.13 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir inspect --clobber
          unzip -q inspect/DragLab_Update.zip -d inspect/pkg
          python3 - <<'PY'
          from pathlib import Path
          s = Path('inspect/pkg/app/DragLab_Server.ps1').read_text()
          needles = [
              'function Get-Stage2Candidates',
              'function Resume-Stage2FromBest',
              'function Start-AutoTune',
              'function On-OfficialRunFinalizedForAutoTune',
              'function Get-AutoTuneStatus',
              'Stage 2 chassis + gearing sweep is complete',
          ]
          lines=s.splitlines()
          for needle in needles:
              print('\n===== '+needle+' =====')
              hits=[i for i,l in enumerate(lines) if needle in l]
              if not hits:
                  print('NOT FOUND'); continue
              for i in hits[:3]:
                  a=max(0,i-25); b=min(len(lines),i+140)
                  for n in range(a,b):
                      print(f'{n+1:05d}: {lines[n]}')
                  print('---')
          PY

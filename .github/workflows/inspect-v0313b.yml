name: Inspect DragLab v0.3.13 candidates

on:
  push:
    paths:
      - '.github/workflows/inspect-v0313b.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Inspect candidate builder
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf inspect
          mkdir inspect
          gh release download v0.3.13 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir inspect --clobber
          unzip -q inspect/DragLab_Update.zip -d inspect/pkg
          python3 - <<'PY'
          from pathlib import Path
          s = Path('inspect/pkg/app/DragLab_Server.ps1').read_text()
          lines=s.splitlines()
          for start_marker,end_marker in [
              ('function Get-AutoTuneCandidates','function Send-AutoTuneValues'),
              ('function Begin-Stage2FromFoundation','function Promote-FastestOfficialPbIfEligible'),
              ('function Start-AutoTune','function Stop-AutoTune'),
          ]:
              print('\n===== '+start_marker+' =====')
              starts=[i for i,l in enumerate(lines) if start_marker in l]
              if not starts:
                  print('NOT FOUND'); continue
              a=starts[0]
              ends=[i for i,l in enumerate(lines[a+1:], start=a+1) if end_marker in l]
              b=ends[0] if ends else min(len(lines),a+240)
              for n in range(a,min(b+1,len(lines))):
                  print(f'{n+1:05d}: {lines[n]}')
          PY

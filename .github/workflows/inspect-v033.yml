name: Inspect v0.3.5 Status

on:
  push:
    paths:
      - '.github/workflows/inspect-v033.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v0.3.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base build
          gh release download v0.3.5 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir base --clobber
          unzip -q base/DragLab_Update.zip -d build
      - name: Show status message handling
        run: |
          nl -ba build/app/DragLab_Server.ps1 | sed -n '710,780p'
          grep -n -C 3 '\$state.status' build/app/DragLab_Server.ps1

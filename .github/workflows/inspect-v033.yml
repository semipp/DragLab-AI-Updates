name: Inspect v0.3.3 Auto-Tune

on:
  push:
    paths:
      - '.github/workflows/inspect-v033.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v0.3.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base build bridge
          gh release download v0.3.3 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir base --clobber
          unzip -q base/DragLab_Update.zip -d build
          unzip -q build/app/BeamNG_Mod/draglab_bridge_v0.2.zip -d bridge
      - name: Inspect server Auto-Tune code
        run: |
          echo "=== SERVER MATCHES ==="
          grep -nEi "AutoTune|Auto-Tune|Send-BeamCommand|bestEt|best.*setup|tirepressure|apply.*tune|set.*variable|reload|respawn" build/app/DragLab_Server.ps1 || true
          echo "=== SERVER CONTEXT 250-650 ==="
          sed -n '250,650p' build/app/DragLab_Server.ps1
      - name: Inspect bridge apply code
        run: |
          echo "=== BRIDGE MATCHES ==="
          grep -nEi "command|apply|variable|set.*var|partConfig|config|reload|respawn|queueLua|tirepressure|jbeam" bridge/lua/vehicle/extensions/auto/draglabTelemetry.lua || true
          echo "=== BRIDGE CONTEXT ==="
          sed -n '1,360p' bridge/lua/vehicle/extensions/auto/draglabTelemetry.lua

name: Inspect v0.3.9 Vehicle Selection

on:
  push:
    paths:
      - '.github/workflows/inspect-v033.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v0.3.9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf base build bridge
          mkdir -p base build bridge
          gh release download v0.3.9 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir base --clobber
          unzip -q base/DragLab_Update.zip -d build
          unzip -q build/app/BeamNG_Mod/draglab_bridge_v0.2.zip -d bridge
      - name: Print vehicle selection code
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('bridge').rglob('*.lua'):
              lines=p.read_text(errors='ignore').splitlines()
              needles=['getPlayerVehicle','getPlayerVehicleID','vehicleName','vehicleKey','setupHash','tunableCount','simple_traffic','be:getObjectByID','getObjectByID','map.objects']
              hits=[i for i,l in enumerate(lines) if any(n.lower() in l.lower() for n in needles)]
              if not hits: continue
              print('FILE',p)
              shown=set()
              for i in hits:
                  a=max(0,i-18); b=min(len(lines),i+30)
                  key=(a,b)
                  if key in shown: continue
                  shown.add(key)
                  print(f'--- {a+1}-{b} ---')
                  for j in range(a,b): print(f'{j+1:5}: {lines[j]}')
          PY

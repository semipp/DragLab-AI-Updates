name: Inspect v0.3.5 Auto-Tune

on:
  push:
    paths:
      - '.github/workflows/inspect-v033.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v0.3.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base build bridge
          gh release download v0.3.5 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir base --clobber
          unzip -q base/DragLab_Update.zip -d build
          unzip -q build/app/BeamNG_Mod/draglab_bridge_v0.2.zip -d bridge
      - name: Show Auto-Tune verification and timeout code
        run: |
          nl -ba build/app/DragLab_Server.ps1 | sed -n '180,470p'
      - name: Show bridge set_vars handler
        run: |
          nl -ba bridge/lua/vehicle/extensions/auto/draglabTelemetry.lua | sed -n '150,260p'

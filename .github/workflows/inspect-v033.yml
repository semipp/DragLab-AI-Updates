name: Inspect v0.3.7 Auto-Tune Core

on:
  push:
    paths:
      - '.github/workflows/inspect-v033.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v0.3.7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf base build
          mkdir -p base build
          gh release download v0.3.7 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir base --clobber
          unzip -q base/DragLab_Update.zip -d build
      - name: Print Auto-Tune core
        run: |
          nl -ba build/app/DragLab_Server.ps1 | sed -n '306,620p'

name: Inspect v0.3.3 Auto-Tune

on:
  push:
    paths:
      - '.github/workflows/inspect-v033.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v0.3.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base build bridge
          gh release download v0.3.3 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir base --clobber
          unzip -q base/DragLab_Update.zip -d build
          unzip -q build/app/BeamNG_Mod/draglab_bridge_v0.2.zip -d bridge
      - name: Show Auto-Tune server core
        run: |
          sed -n '120,440p' build/app/DragLab_Server.ps1
      - name: Show bridge apply code
        run: |
          sed -n '120,230p' bridge/lua/vehicle/extensions/auto/draglabTelemetry.lua

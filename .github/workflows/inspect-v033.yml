name: Inspect v0.3.6 Dashboard Hooks

on:
  push:
    paths:
      - '.github/workflows/inspect-v033.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v0.3.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base build
          gh release download v0.3.6 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir base --clobber
          unzip -q base/DragLab_Update.zip -d build
      - name: Show dashboard top controls and server HTTP routes
        run: |
          echo '=== HTML controls ==='
          grep -n -C 6 -Ei 'Diagnostic Test Pass|Export Runs|Clear History|autoTune|fetch\(|api/' build/app/www/index.html | head -n 420
          echo '=== SERVER routes ==='
          grep -n -C 8 -Ei 'api/|RawUrl|HttpListener|AbsolutePath|GetContext|POST|diagnostic|export|clear' build/app/DragLab_Server.ps1 | head -n 520

name: Inspect v0.3.6 Run Capture

on:
  push:
    paths:
      - '.github/workflows/inspect-v033.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v0.3.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base build bridge
          gh release download v0.3.6 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir base --clobber
          unzip -q base/DragLab_Update.zip -d build
          unzip -q build/app/BeamNG_Mod/draglab_bridge_v0.2.zip -d bridge
      - name: Show run-save and official timing code
        run: |
          echo '=== SERVER run save / official matches ==='
          grep -n -C 5 -Ei 'official|timeslip|330|1000|Save-Runs|runs.Add|setupHash|timingSource|eighth|sixty' build/app/DragLab_Server.ps1 | head -n 420
          echo '=== BRIDGE official matches ==='
          grep -n -C 5 -Ei 'official|timeslip|330|1000|eighth|sixty|quarter|drag' bridge/lua/vehicle/extensions/auto/draglabTelemetry.lua | head -n 420

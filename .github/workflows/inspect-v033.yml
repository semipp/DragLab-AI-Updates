name: Inspect v0.3.6 Sync Patch Points

on:
  push:
    paths:
      - '.github/workflows/inspect-v033.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v0.3.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base build
          gh release download v0.3.6 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir base --clobber
          unzip -q base/DragLab_Update.zip -d build
      - name: Show patch points
        run: |
          echo '=== top ==='
          nl -ba build/app/DragLab_Server.ps1 | sed -n '1,95p'
          echo '=== autotune save ==='
          nl -ba build/app/DragLab_Server.ps1 | sed -n '145,230p'
          echo '=== official apply ==='
          nl -ba build/app/DragLab_Server.ps1 | sed -n '535,620p'
          echo '=== status ==='
          nl -ba build/app/DragLab_Server.ps1 | sed -n '820,930p'

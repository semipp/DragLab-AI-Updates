name: Inspect v0.3.11 Auto-Tune Resume

on:
  push:
    paths:
      - '.github/workflows/inspect-v033.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v0.3.11
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf base build
          mkdir -p base build
          gh release download v0.3.11 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir base --clobber
          unzip -q base/DragLab_Update.zip -d build
      - name: Print resume/revert logic
        run: |
          sed -n '244,286p' build/app/DragLab_Server.ps1
          echo '=== JUDGE TAIL ==='
          sed -n '524,590p' build/app/DragLab_Server.ps1
          echo '=== RESET LOGIC ==='
          grep -n -C 25 "WAITING FOR RESET" build/app/DragLab_Server.ps1 || true

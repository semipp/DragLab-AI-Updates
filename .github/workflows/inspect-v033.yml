name: Inspect v0.3.6 Official Split Capture

on:
  push:
    paths:
      - '.github/workflows/inspect-v033.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v0.3.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base build bridge
          gh release download v0.3.6 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir base --clobber
          unzip -q base/DragLab_Update.zip -d build
          unzip -q build/app/BeamNG_Mod/draglab_bridge_v0.2.zip -d bridge
      - name: List bridge files and show official sync
        run: |
          find bridge -type f -maxdepth 8 -print
          echo '=== GE official sync ==='
          OFF=$(find bridge -type f -iname '*Official*' -o -iname '*official*' | head -n 1)
          echo "$OFF"
          if [ -n "$OFF" ]; then nl -ba "$OFF" | sed -n '1,420p'; fi

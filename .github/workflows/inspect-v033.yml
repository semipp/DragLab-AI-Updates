name: Inspect v0.3.8 Auto-Tune Reset Flow

on:
  push:
    paths:
      - '.github/workflows/inspect-v033.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v0.3.8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf base build
          mkdir -p base build
          gh release download v0.3.8 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir base --clobber
          unzip -q base/DragLab_Update.zip -d build
      - name: Print reset and setup flow
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build/app/DragLab_Server.ps1')
          lines=p.read_text().splitlines()
          needles=['WAITING FOR RESET','pendingApply','On-SetupUpdatedForAutoTune','Start-NextAutoTuneExperiment','status -eq','state.status','On-Telemetry','Handle-Telemetry','setupHash']
          hits=[]
          for i,line in enumerate(lines):
              if any(n.lower() in line.lower() for n in needles):
                  hits.append(i)
          for i in hits:
              if 620 <= i+1 <= 1050:
                  a=max(0,i-12); b=min(len(lines),i+24)
                  print(f'--- lines {a+1}-{b} ---')
                  for j in range(a,b): print(f'{j+1:5}: {lines[j]}')
          PY

name: Inspect v0.3.7 Auto-Tune

on:
  push:
    paths:
      - '.github/workflows/inspect-v033.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v0.3.7
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf base build
          mkdir -p base build
          gh release download v0.3.7 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir base --clobber
          unzip -q base/DragLab_Update.zip -d build
      - name: Auto-Tune source excerpts
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('build/app/DragLab_Server.ps1')
          lines=p.read_text().splitlines()
          needles=['AutoTuneCandidates','Get-AutoTune','candidateIndex','Safe v0.3 candidate sweep','damp_bump_F','tirepressure_R','arb_spring_R','spring_R','damp_rebound_F','Apply-AutoTune','Start-AutoTune','On-OfficialRunFinalizedForAutoTune']
          hits=[]
          for i,line in enumerate(lines):
              if any(n.lower() in line.lower() for n in needles):
                  hits.append(i)
          shown=set()
          for i in hits:
              a=max(0,i-18); b=min(len(lines),i+30)
              key=(a,b)
              if key in shown: continue
              shown.add(key)
              print(f'--- lines {a+1}-{b} ---')
              for j in range(a,b):
                  print(f'{j+1:5}: {lines[j]}')
          PY

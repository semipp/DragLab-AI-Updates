name: Inspect v0.3.3 Auto-Tune

on:
  push:
    paths:
      - '.github/workflows/inspect-v033.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download v0.3.3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p base build
          gh release download v0.3.3 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir base --clobber
          unzip -q base/DragLab_Update.zip -d build
      - name: Show exact experiment and revert blocks
        run: |
          nl -ba build/app/DragLab_Server.ps1 | sed -n '255,390p'

name: Publish DragLab Update

on:
  push:
    paths:
      - 'release/version.txt'
      - 'release/notes.md'
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build v0.3.5 from verified v0.3.4 base
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf base build bridge_work
          mkdir -p base build
          gh release download v0.3.4 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir base --clobber
          unzip -q base/DragLab_Update.zip -d build

          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile, shutil

          app = Path('build/app')

          p = app / 'version.json'
          d = json.loads(p.read_text())
          d['version'] = '0.3.5'
          d['bridgeVersion'] = '0.3.5'
          p.write_text(json.dumps(d, indent=2) + '\n')

          p = app / 'DragLab_Server.ps1'
          p.write_text(p.read_text().replace('v0.3.4', 'v0.3.5'))

          p = app / 'www' / 'index.html'
          p.write_text(p.read_text().replace('v0.3.4', 'v0.3.5'))

          bridge_zip = app / 'BeamNG_Mod' / 'draglab_bridge_v0.2.zip'
          work = Path('bridge_work')
          if work.exists():
              shutil.rmtree(work)
          work.mkdir()
          with zipfile.ZipFile(bridge_zip, 'r') as z:
              z.extractall(work)

          info = work / 'info.json'
          idata = json.loads(info.read_text())
          idata['version'] = '0.3.5'
          info.write_text(json.dumps(idata, indent=2) + '\n')

          lua = work / 'lua' / 'vehicle' / 'extensions' / 'auto' / 'draglabTelemetry.lua'
          s = lua.read_text()
          s = s.replace("payload.version = '0.3.1'", "payload.version = '0.3.5'")
          s = s.replace("payload.version = '0.3.2'", "payload.version = '0.3.5'")
          s = s.replace("payload.version = '0.3.3'", "payload.version = '0.3.5'")
          s = s.replace("payload.version = '0.3.4'", "payload.version = '0.3.5'")

          old = """  local mn = tonumber(def.min)
  local mx = tonumber(def.max)
  if mn and n < mn - 1e-9 then return nil, 'below minimum' end
  if mx and n > mx + 1e-9 then return nil, 'above maximum' end
  return n, nil
"""
          new = """  local mn = tonumber(def.min)
  local mx = tonumber(def.max)
  -- Some BeamNG JBeam variables intentionally publish their endpoints in
  -- descending order (for example toe/caster can report 1.02 -> 0.98).
  -- Treat min/max as two bounds, not as guaranteed low/high values.
  local lo = mn
  local hi = mx
  if mn and mx and mn > mx then
    lo = mx
    hi = mn
  end
  if lo and n < lo - 1e-9 then return nil, 'below lower bound' end
  if hi and n > hi + 1e-9 then return nil, 'above upper bound' end
  return n, nil
"""
          if old not in s:
              raise RuntimeError('clampTuneValue bounds block not found')
          s = s.replace(old, new, 1)
          lua.write_text(s)

          with zipfile.ZipFile(bridge_zip, 'w', zipfile.ZIP_DEFLATED) as z:
              for f in sorted(work.rglob('*')):
                  if f.is_file():
                      z.write(f, f.relative_to(work).as_posix())
          PY

          rm -f release/DragLab_Update.zip
          (cd build && zip -qr ../release/DragLab_Update.zip app)

          test "$(stat -c%s release/DragLab_Update.zip)" -gt 30000
          unzip -t release/DragLab_Update.zip

          python3 - <<'PY'
          import json, zipfile, io
          z = zipfile.ZipFile('release/DragLab_Update.zip')
          v = json.loads(z.read('app/version.json'))
          assert v['version'] == '0.3.5'
          bz = zipfile.ZipFile(io.BytesIO(z.read('app/BeamNG_Mod/draglab_bridge_v0.2.zip')))
          lua = bz.read('lua/vehicle/extensions/auto/draglabTelemetry.lua').decode()
          assert 'if mn and mx and mn > mx then' in lua
          assert "below lower bound" in lua
          assert "above upper bound" in lua
          print('Verified JLRP v0.3.5 descending-bound validation fix')
          PY

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cat release/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" release/DragLab_Update.zip \
            --title "JLRP DragLab $TAG" \
            --notes-file release/notes.md

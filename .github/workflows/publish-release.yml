name: Publish DragLab Update

on:
  push:
    paths:
      - 'release/version.txt'
      - 'release/notes.md'
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build v0.3.4 from verified v0.3.3 base
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf base build
          mkdir -p base build
          gh release download v0.3.3 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir base --clobber
          unzip -q base/DragLab_Update.zip -d build

          python3 - <<'PY'
          from pathlib import Path
          import json, re

          app = Path('build/app')

          p = app / 'version.json'
          d = json.loads(p.read_text())
          d['version'] = '0.3.4'
          p.write_text(json.dumps(d, indent=2) + '\n')

          p = app / 'DragLab_Server.ps1'
          s = p.read_text().replace('v0.3.3', 'v0.3.4')

          helper = "\n".join([
              "function Convert-SetupToValues($setup, [string]$overrideName, $overrideValue) {",
              "    $values = [pscustomobject]@{}",
              "    foreach ($v in @($setup)) {",
              "        $name = [string]$v.name",
              "        if (-not $name) { continue }",
              "        try {",
              "            $n = [double]$v.value",
              "            $values | Add-Member -NotePropertyName $name -NotePropertyValue $n -Force",
              "        } catch {}",
              "    }",
              "    if ($overrideName) {",
              "        $values | Add-Member -NotePropertyName $overrideName -NotePropertyValue ([double]$overrideValue) -Force",
              "    }",
              "    return $values",
              "}",
              ""
          ]) + "\n"

          needle = 'function Get-AutoTuneCandidates($setup) {'
          if 'function Convert-SetupToValues(' not in s:
              if needle not in s:
                  raise RuntimeError('candidate helper insertion point not found')
              s = s.replace(needle, helper + needle, 1)

          pat = re.compile(r"\$vals = \[pscustomobject\]@\{\}\r?\n\s*\$vals \| Add-Member -NotePropertyName \$c\.name -NotePropertyValue \(\[double\]\$target\)")
          s, n = pat.subn(r"$vals = Convert-SetupToValues $autoTune.bestSetup $c.name ([double]$target)", s, count=1)
          if n != 1:
              raise RuntimeError(f'experiment full-setup patch count={n}')

          pat = re.compile(r"\$vals = \[pscustomobject\]@\{\}\r?\n\s*\$vals \| Add-Member -NotePropertyName \$c\.name -NotePropertyValue \(\[double\]\$bestValue\)")
          s, n = pat.subn(r"$vals = Convert-SetupToValues $autoTune.bestSetup $null $null", s, count=1)
          if n != 1:
              raise RuntimeError(f'revert full-setup patch count={n}')

          old_restore = "\n".join([
              "    $values = [pscustomobject]@{}",
              "    foreach ($c in @($autoTune.candidateStates)) {",
              "        $v = Get-SetupValue $autoTune.bestSetup $c.name",
              "        if ($null -ne $v) { $values | Add-Member -NotePropertyName $c.name -NotePropertyValue ([double]$v) -Force }",
              "    }",
              "    if ($values.PSObject.Properties.Count -eq 0) { throw 'No managed Auto-Tune values are available to restore.' }",
              ""
          ])
          new_restore = "\n".join([
              "    $values = Convert-SetupToValues $autoTune.bestSetup $null $null",
              "    if ($values.PSObject.Properties.Count -eq 0) { throw 'No captured setup values are available to restore.' }",
              ""
          ])
          if old_restore not in s:
              raise RuntimeError('restore block not found')
          s = s.replace(old_restore, new_restore, 1)

          old_base = "\n".join([
              "    $baseline = $null",
              "    for ($i=$runs.Count-1; $i -ge 0; $i--) {",
              "        $r=$runs[$i]",
              "        if ([string]$r.timingSource -eq 'beamng-official' -and $null -ne $r.setup -and @($r.setup).Count -gt 0) { $baseline=$r; break }",
              "    }",
              ""
          ])
          new_base = "\n".join([
              "    $baseline = $null",
              "    $eligible = New-Object System.Collections.ArrayList",
              "    foreach ($r in @($runs)) {",
              "        if ([string]$r.timingSource -ne 'beamng-official') { continue }",
              "        if ($null -eq $r.setup -or @($r.setup).Count -eq 0) { continue }",
              "        if ($state.vehicleKey -and $r.vehicleKey -and ([string]$state.vehicleKey -ne [string]$r.vehicleKey)) { continue }",
              "        if ($state.setupHash -and $r.setupHash -and ([string]$state.setupHash -ne [string]$r.setupHash)) { continue }",
              "        [void]$eligible.Add($r)",
              "    }",
              "    if ($eligible.Count -gt 0) {",
              "        $baseline = @($eligible | Sort-Object { [double]$_.et })[0]",
              "    }",
              ""
          ])
          if old_base not in s:
              raise RuntimeError('baseline selection block not found')
          s = s.replace(old_base, new_base, 1)

          s = s.replace(
              'Tune applied and verified. Make a full quarter-mile pass; only BeamNG official timing will be judged.',
              'Tune applied and FULL SETUP verified. Make a full quarter-mile pass; only BeamNG official timing will be judged.'
          )

          p.write_text(s)

          p = app / 'www' / 'index.html'
          p.write_text(p.read_text().replace('v0.3.3', 'v0.3.4'))
          PY

          rm -f release/DragLab_Update.zip
          (cd build && zip -qr ../release/DragLab_Update.zip app)

          test "$(stat -c%s release/DragLab_Update.zip)" -gt 30000
          unzip -t release/DragLab_Update.zip

          python3 - <<'PY'
          import json, zipfile
          z = zipfile.ZipFile('release/DragLab_Update.zip')
          v = json.loads(z.read('app/version.json'))
          assert v['version'] == '0.3.4'
          server = z.read('app/DragLab_Server.ps1').decode()
          assert 'function Convert-SetupToValues(' in server
          assert '$vals = Convert-SetupToValues $autoTune.bestSetup $c.name ([double]$target)' in server
          assert '$vals = Convert-SetupToValues $autoTune.bestSetup $null $null' in server
          assert '$values = Convert-SetupToValues $autoTune.bestSetup $null $null' in server
          assert '$baseline = @($eligible | Sort-Object { [double]$_.et })[0]' in server
          assert 'FULL SETUP verified' in server
          print('Verified JLRP v0.3.4 full-config preservation + fastest matching baseline')
          PY

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cat release/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" release/DragLab_Update.zip \
            --title "JLRP DragLab $TAG" \
            --notes-file release/notes.md

name: Publish DragLab Update

on:
  push:
    paths:
      - 'release/version.txt'
      - 'release/notes.md'
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build v0.3.3 from verified v0.3.2 base
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf base build
          mkdir -p base build
          gh release download v0.3.2 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir base --clobber
          unzip -q base/DragLab_Update.zip -d build

          python3 - <<'PY'
          from pathlib import Path
          import json

          app = Path('build/app')

          p = app / 'version.json'
          d = json.loads(p.read_text())
          d['version'] = '0.3.3'
          p.write_text(json.dumps(d, indent=2) + '\n')

          p = app / 'DragLab_Server.ps1'
          s = p.read_text()
          s = s.replace('v0.3.2', 'v0.3.3')
          old = "    $payload.source = 'JLRPDesktop'\n    $payload.version = '0.3.0'"
          new = "    Add-OrSetProperty $payload 'source' 'JLRPDesktop'\n    Add-OrSetProperty $payload 'version' '0.3.3'"
          if old not in s:
              raise RuntimeError('unsafe Send-BeamCommand property assignment not found')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = app / 'www' / 'index.html'
          s = p.read_text().replace('v0.3.2', 'v0.3.3')
          p.write_text(s)
          PY

          rm -f release/DragLab_Update.zip
          (cd build && zip -qr ../release/DragLab_Update.zip app)

          test "$(stat -c%s release/DragLab_Update.zip)" -gt 30000
          unzip -t release/DragLab_Update.zip

          python3 - <<'PY'
          import json, zipfile
          z = zipfile.ZipFile('release/DragLab_Update.zip')
          v = json.loads(z.read('app/version.json'))
          assert v['version'] == '0.3.3'
          server = z.read('app/DragLab_Server.ps1').decode()
          assert "Add-OrSetProperty $payload 'source' 'JLRPDesktop'" in server
          assert "Add-OrSetProperty $payload 'version' '0.3.3'" in server
          assert "$payload.source = 'JLRPDesktop'" not in server
          print('Verified JLRP v0.3.3 Auto-Tune command payload fix')
          PY

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cat release/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" release/DragLab_Update.zip \
            --title "JLRP DragLab $TAG" \
            --notes-file release/notes.md

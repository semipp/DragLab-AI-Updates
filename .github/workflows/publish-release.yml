name: Publish DragLab Update

on:
  push:
    paths:
      - 'release/version.txt'
      - 'release/notes.md'
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build v0.3.2 from verified v0.3.1 base
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf base build bridge_work
          mkdir -p base build
          gh release download v0.3.1 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir base --clobber
          unzip -q base/DragLab_Update.zip -d build

          python3 - <<'PY'
          from pathlib import Path
          import json, zipfile, shutil

          app = Path('build/app')

          p = app / 'version.json'
          d = json.loads(p.read_text())
          d['version'] = '0.3.2'
          d['bridgeVersion'] = '0.3.2'
          p.write_text(json.dumps(d, indent=2) + '\n')

          p = app / 'DragLab_Server.ps1'
          s = p.read_text().replace('v0.3.1', 'v0.3.2')
          p.write_text(s)

          p = app / 'www' / 'index.html'
          s = p.read_text().replace('v0.3.1', 'v0.3.2')
          s = s.replace('No tuning variables received yet. Connect BeamNG and spawn a vehicle.',
                        'Waiting for full tuning-variable payload from BeamNG...')
          p.write_text(s)

          bridge_zip = app / 'BeamNG_Mod' / 'draglab_bridge_v0.2.zip'
          work = Path('bridge_work')
          if work.exists():
              shutil.rmtree(work)
          work.mkdir()
          with zipfile.ZipFile(bridge_zip, 'r') as z:
              z.extractall(work)

          info = work / 'info.json'
          idata = json.loads(info.read_text())
          idata['version'] = '0.3.2'
          info.write_text(json.dumps(idata, indent=2) + '\n')

          lua = work / 'lua' / 'vehicle' / 'extensions' / 'auto' / 'draglabTelemetry.lua'
          s = lua.read_text()
          s = s.replace('v0.3.1', 'v0.3.2')

          old = """  helloTimer = helloTimer + dt
  if helloTimer >= HELLO_INTERVAL then
    helloTimer = 0
    sendHello(false)
  end
"""
          new = """  helloTimer = helloTimer + dt
  if helloTimer >= HELLO_INTERVAL then
    helloTimer = 0
    -- v0.3.2: force the complete setup payload each retry. The top-level count
    -- can be correct before the desktop has the actual table, so hash-only
    -- retries can leave Setup Scanner empty forever.
    sendHello(true)
  end
"""
          if old not in s:
              raise RuntimeError('v0.3.1 hello retry block not found')
          s = s.replace(old, new, 1)
          lua.write_text(s)

          with zipfile.ZipFile(bridge_zip, 'w', zipfile.ZIP_DEFLATED) as z:
              for f in sorted(work.rglob('*')):
                  if f.is_file():
                      z.write(f, f.relative_to(work).as_posix())
          PY

          rm -f release/DragLab_Update.zip
          (cd build && zip -qr ../release/DragLab_Update.zip app)

          test "$(stat -c%s release/DragLab_Update.zip)" -gt 30000
          unzip -t release/DragLab_Update.zip

          python3 - <<'PY'
          import json, zipfile, io
          z = zipfile.ZipFile('release/DragLab_Update.zip')
          v = json.loads(z.read('app/version.json'))
          assert v['version'] == '0.3.2'
          bz = zipfile.ZipFile(io.BytesIO(z.read('app/BeamNG_Mod/draglab_bridge_v0.2.zip')))
          lua = bz.read('lua/vehicle/extensions/auto/draglabTelemetry.lua').decode()
          assert 'sendHello(true)' in lua
          assert 'force the complete setup payload' in lua
          print('Verified JLRP v0.3.2 full setup payload retry')
          PY

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cat release/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" release/DragLab_Update.zip \
            --title "JLRP DragLab $TAG" \
            --notes-file release/notes.md

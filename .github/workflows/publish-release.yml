name: Publish DragLab Update

on:
  push:
    paths:
      - 'package_b64/**'
      - 'pack2/**'
      - 'release/version.txt'
      - 'release/notes.md'
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild and verify update ZIP
        shell: bash
        run: |
          cat             pack2/p00a.txt             pack2/p00b1a1.txt             pack2/p00b1a2x1.txt             pack2/p00b1a2x2.txt             pack2/p00b1b.txt             pack2/p00b2.txt             package_b64/part01.txt             package_b64/part02.txt             pack2/p03a.txt             pack2/p03b.txt             package_b64/part04.txt             package_b64/part05.txt             package_b64/part06.txt             | tr -d '\r\n' | base64 --decode > release/DragLab_Update.zip
          test "$(stat -c%s release/DragLab_Update.zip)" -eq 37165
          echo "9b33a6e96eb0faf7caf9c2b578ec147503bfaa9c42e8be75bccc22c3e82c86a1  release/DragLab_Update.zip" | sha256sum -c -
          unzip -t release/DragLab_Update.zip

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cat release/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" release/DragLab_Update.zip \
            --title "JLRP DragLab $TAG" \
            --notes-file release/notes.md

name: Publish DragLab Update

on:
  push:
    paths:
      - 'release/version.txt'
      - 'release/notes.md'
      - 'release/build_v0314.py'
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build v0.3.14 from verified v0.3.13 base
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf base build verify_app
          mkdir -p base build
          gh release download v0.3.13 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir base --clobber
          unzip -q base/DragLab_Update.zip -d build
          python3 release/build_v0314.py build

          rm -f release/DragLab_Update.zip
          (cd build && zip -qr ../release/DragLab_Update.zip app)

          test "$(stat -c%s release/DragLab_Update.zip)" -gt 30000
          unzip -t release/DragLab_Update.zip

      - name: Verify v0.3.14 package
        shell: bash
        run: |
          python3 - <<'PY'
          import json, zipfile, io
          z = zipfile.ZipFile('release/DragLab_Update.zip')
          v = json.loads(z.read('app/version.json'))
          assert v['version'] == '0.3.14'
          assert v['bridgeVersion'] == '0.3.10'

          server = z.read('app/DragLab_Server.ps1').decode()
          required = [
              "stage2CandidateStates = @()",
              "stage2HistoryCount = 0",
              "stage3BaselineRunId = $null",
              "stage3BaselineEt = $null",
              "} elseif ($stage -eq 3) {",
              "$name -eq '$tirepressure_R'",
              "$name -eq '$arb_spring_R'",
              "$name -eq '$spring_R'",
              "$name -eq '$damp_rebound_F'",
              "$name -eq '$damp_bump_F'",
              "function Begin-Stage3FromBest",
              "function Resume-Stage3FromBest",
              "$autoTune.stage2CandidateStates = @($autoTune.candidateStates)",
              "$autoTune.stage2HistoryCount = @($autoTune.history).Count",
              "$autoTune.stage3BaselineRunId = [string]$autoTune.bestRunId",
              "$autoTune.stage3BaselineEt = [double]$autoTune.bestEt",
              "$autoTune.stage = 3",
              "Get-AutoTuneCandidates $autoTune.bestSetup 3",
              "Convert-SetupToValues $autoTune.bestSetup $null $null",
              "Send-AutoTuneValues $vals 'stage3-foundation'",
              "Send-AutoTuneValues $vals 'stage3-resume'",
              "stage=[int]$autoTune.stage; runId=$run.id",
              "Post-Gearing Chassis Refinement",
              "stage2Candidates=@($autoTune.stage2CandidateStates)",
              "function Promote-CompletedAutoTunePbIfEligible",
              "function Recover-MissedOfficialAutoTunePass",
              "Request-RunSync 'official-pass'",
              "$script:playerVehicleId = $null",
              "if ([string]$msg.vehicleId -ne [string]$script:playerVehicleId)",
          ]
          for needle in required:
              assert needle in server, needle

          stage3 = server.split("function Begin-Stage3FromBest",1)[1].split("function Resume-Stage3FromBest",1)[0]
          for forbidden in [
              "$autoTune.baselineRunId =",
              "$autoTune.history =",
              "$runs.Clear()",
          ]:
              assert forbidden not in stage3, forbidden

          p_archive = stage3.index("$autoTune.stage2CandidateStates = @($autoTune.candidateStates)")
          p_replace = stage3.index("$autoTune.candidateStates = @($candidates)")
          assert p_archive < p_replace

          start = server.split("function Start-AutoTune",1)[1].split("function Stop-AutoTune",1)[0]
          assert "Begin-Stage3FromBest 'Stage 2 is complete." in start
          assert "if ($stageNow -eq 3)" in start
          assert "Resume-Stage3FromBest" in start

          assert "$resumeComplete = $false" in server
          assert "On-OfficialRunFinalizedForAutoTune $missed" in server
          assert "Auto-Tune OFFICIAL judge failed:" in server
          assert "$script:beamRemote = [System.Net.IPEndPoint]::new($remote.Address, $remote.Port)" not in server
          assert "$script:beamRemote = [System.Net.IPEndPoint]::new($senderRemote.Address, $senderRemote.Port)" in server

          bz = zipfile.ZipFile(io.BytesIO(z.read('app/BeamNG_Mod/draglab_bridge_v0.2.zip')))
          ge = bz.read('lua/ge/extensions/draglabOfficialSync.lua').decode()
          for needle in ["type='player_vehicle_status'", "playerVehicleId=getPlayerVehicleId()", "playerHeartbeatTimer >= 0.5"]:
              assert needle in ge, needle
          info = json.loads(bz.read('info.json'))
          assert info['version'] == '0.3.10'

          html = z.read('app/www/index.html').decode()
          assert '0.3.14' in html
          assert 'Stage 3 starts only after completed Stage 2' in html
          print('Verified JLRP v0.3.14 Stage 3 post-gearing chassis refinement')
          PY

          mkdir -p verify_app
          unzip -q release/DragLab_Update.zip -d verify_app
          pwsh -NoProfile -Command '$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile("verify_app/app/DragLab_Server.ps1",[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){$errors|ForEach-Object{Write-Error $_};exit 1}'
          pwsh -NoProfile -Command '$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile("verify_app/app/Sync_JLRP_RunData.ps1",[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){$errors|ForEach-Object{Write-Error $_};exit 1}'
          pwsh -NoProfile -Command '$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile("verify_app/app/Setup_JLRP_Run_Sync.ps1",[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){$errors|ForEach-Object{Write-Error $_};exit 1}'

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cat release/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" release/DragLab_Update.zip \
            --title "JLRP DragLab $TAG" \
            --notes-file release/notes.md

name: Publish DragLab Update

on:
  push:
    paths:
      - 'release/version.txt'
      - 'release/notes.md'
      - 'release/build_v039.py'
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build v0.3.9 from verified v0.3.8 base
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf base build bridge_work_v039 verify_app
          mkdir -p base build
          gh release download v0.3.8 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir base --clobber
          unzip -q base/DragLab_Update.zip -d build
          python3 release/build_v039.py build

          rm -f release/DragLab_Update.zip
          (cd build && zip -qr ../release/DragLab_Update.zip app)

          test "$(stat -c%s release/DragLab_Update.zip)" -gt 30000
          unzip -t release/DragLab_Update.zip

      - name: Verify v0.3.9 package
        shell: bash
        run: |
          python3 - <<'PY'
          import json, zipfile, io
          z = zipfile.ZipFile('release/DragLab_Update.zip')
          v = json.loads(z.read('app/version.json'))
          assert v['version'] == '0.3.9'
          assert v['bridgeVersion'] == '0.3.9'

          server = z.read('app/DragLab_Server.ps1').decode()
          required = [
              "foundationRepaired = $false",
              "Get-Stage1FoundationRun",
              "Begin-Stage2FromFoundation",
              "Resume-Stage2FromBest",
              "v0.3.9 detected the v0.3.8 foundation bug",
              "Invalid Stage 2 decisions were discarded",
              "RESTORING STAGE 1 FOUNDATION",
              "stage2-foundation",
              "stage2-resume",
              "foundationRepaired=[bool]$autoTune.foundationRepaired",
              "Get-AutoTuneCandidates $foundationRun.setup 2",
          ]
          for needle in required:
              assert needle in server, needle

          # Make sure the migration really resets invalid v0.3.8 Stage 2 state.
          assert "$autoTune.candidateIndex = 0" in server
          assert "$autoTune.history = New-Object System.Collections.ArrayList" in server
          assert "$autoTune.bestSetup = @($foundationRun.setup)" in server
          assert "$autoTune.bestEt = [double]$foundationRun.et" in server

          html = z.read('app/www/index.html').decode()
          assert '0.3.9' in html
          assert 'anchored to the proven Stage 1 best' in html

          setup = z.read('app/Setup_JLRP_Run_Sync.ps1').decode()
          sync = z.read('app/Sync_JLRP_RunData.ps1').decode()
          for txt in (setup, sync):
              assert "$authExit = $LASTEXITCODE" in txt

          bz = zipfile.ZipFile(io.BytesIO(z.read('app/BeamNG_Mod/draglab_bridge_v0.2.zip')))
          info = json.loads(bz.read('info.json'))
          assert info['version'] == '0.3.9'
          print('Verified JLRP v0.3.9 Stage 2 foundation continuity repair')
          PY

          mkdir -p verify_app
          unzip -q release/DragLab_Update.zip -d verify_app
          pwsh -NoProfile -Command '$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile("verify_app/app/DragLab_Server.ps1",[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){$errors|ForEach-Object{Write-Error $_};exit 1}'
          pwsh -NoProfile -Command '$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile("verify_app/app/Sync_JLRP_RunData.ps1",[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){$errors|ForEach-Object{Write-Error $_};exit 1}'
          pwsh -NoProfile -Command '$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile("verify_app/app/Setup_JLRP_Run_Sync.ps1",[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){$errors|ForEach-Object{Write-Error $_};exit 1}'

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cat release/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" release/DragLab_Update.zip \
            --title "JLRP DragLab $TAG" \
            --notes-file release/notes.md

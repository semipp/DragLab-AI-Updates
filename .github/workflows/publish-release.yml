name: Publish DragLab Update

on:
  push:
    paths:
      - 'release/DragLab_Update.zip'
      - 'release/version.txt'
      - 'release/notes.md'
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify update ZIP
        shell: bash
        run: |
          test "$(stat -c%s release/DragLab_Update.zip)" -eq 38816
          echo "ac0e6e51caf61fb86610f51bf00143d453c04d7e5a042d947d453511e263753b  release/DragLab_Update.zip" | sha256sum -c -
          unzip -t release/DragLab_Update.zip

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cat release/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" release/DragLab_Update.zip             --title "JLRP DragLab $TAG"             --notes-file release/notes.md

name: Publish DragLab Update

on:
  push:
    paths:
      - 'release/version.txt'
      - 'release/notes.md'
      - 'release/build_v037.py'
      - '.github/workflows/publish-release.yml'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build v0.3.7 from verified v0.3.6 base
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf base build bridge_work_v037
          mkdir -p base build
          gh release download v0.3.6 --repo semipp/DragLab-AI-Updates --pattern DragLab_Update.zip --dir base --clobber
          unzip -q base/DragLab_Update.zip -d build
          python3 release/build_v037.py build

          rm -f release/DragLab_Update.zip
          (cd build && zip -qr ../release/DragLab_Update.zip app)

          test "$(stat -c%s release/DragLab_Update.zip)" -gt 30000
          unzip -t release/DragLab_Update.zip

      - name: Verify v0.3.7 package
        shell: bash
        run: |
          python3 - <<'PY'
          import json, zipfile, io
          z = zipfile.ZipFile('release/DragLab_Update.zip')
          v = json.loads(z.read('app/version.json'))
          assert v['version'] == '0.3.7'
          assert v['bridgeVersion'] == '0.3.7'

          names = set(z.namelist())
          assert 'app/Sync_JLRP_RunData.ps1' in names
          assert 'app/Setup_JLRP_Run_Sync.ps1' in names
          assert 'app/Setup_JLRP_Run_Sync.bat' in names

          server = z.read('app/DragLab_Server.ps1').decode()
          assert "repo = 'semipp/DragLab-AI'" in server
          assert "path = 'run-data/latest.json'" in server
          assert "Request-RunSync 'official-pass'" in server
          assert "runSync = (Get-RunSyncStatus)" in server
          assert "officialThreeThirty" in server
          assert "officialThousand" in server
          assert "officialReaction" in server

          html = z.read('app/www/index.html').decode()
          assert 'id="syncSetupBtn"' in html
          assert 'Private Run Sync' in html
          assert 'v0.3.7' in html

          bz = zipfile.ZipFile(io.BytesIO(z.read('app/BeamNG_Mod/draglab_bridge_v0.2.zip')))
          ge = bz.read('lua/ge/extensions/draglabOfficialSync.lua').decode()
          assert "threeThirty = slip.threeThirty" in ge
          assert "thousand = slip.thousand" in ge
          assert "reaction = slip.reaction" in ge
          print('Verified JLRP v0.3.7 private run sync + full official split capture')
          PY

          mkdir -p verify_app
          unzip -q release/DragLab_Update.zip -d verify_app
          pwsh -NoProfile -Command '$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile("verify_app/app/DragLab_Server.ps1",[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){$errors|ForEach-Object{Write-Error $_};exit 1}'
          pwsh -NoProfile -Command '$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile("verify_app/app/Sync_JLRP_RunData.ps1",[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){$errors|ForEach-Object{Write-Error $_};exit 1}'
          pwsh -NoProfile -Command '$tokens=$null;$errors=$null;[System.Management.Automation.Language.Parser]::ParseFile("verify_app/app/Setup_JLRP_Run_Sync.ps1",[ref]$tokens,[ref]$errors)|Out-Null;if($errors.Count){$errors|ForEach-Object{Write-Error $_};exit 1}'

      - name: Read version
        id: version
        shell: bash
        run: echo "version=$(cat release/version.txt)" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          TAG="v${VERSION}"
          gh release delete "$TAG" --yes --cleanup-tag || true
          gh release create "$TAG" release/DragLab_Update.zip             --title "JLRP DragLab $TAG"             --notes-file release/notes.md
